services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: foss-backend
    restart: unless-stopped
    ports:
      - "4300:4300"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=4300
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/food_ordering}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - MOCK_EXTERNAL_SERVICES=${MOCK_EXTERNAL_SERVICES:-true}
      - DEMO_MODE=${DEMO_MODE:-true}
      - QR_SIGNING_SECRET=${QR_SIGNING_SECRET:-development-demo-qr-signing-secret-at-least-32-chars-long}
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY:-development-internal-service-key-at-least-32-chars}
      - FDS_WEBHOOK_SECRET=${FDS_WEBHOOK_SECRET:-development-fds-webhook-secret-at-least-32-chars}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:4300/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: foss-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3000
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8080/foss}
      - NEXT_PUBLIC_GATEWAY_URL=${NEXT_PUBLIC_GATEWAY_URL:-http://localhost:8080}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:16
    container_name: foss-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: food_ordering
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: foss-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  postgres_data:
  rabbitmq_data: